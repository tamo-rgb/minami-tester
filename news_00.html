<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WellNews | 健康メディア</title>
<style>
body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  background: #f6f9f6;
  color: #333;
  margin: 0;
  padding: 0;
}

header {
  text-align: center;
  background: #89c997;
  color: white;
  padding: 2rem 1rem;
}
header h1 { margin: 0; font-size: 2.2rem; }
.subtitle { font-size: 1rem; opacity: 0.9; }

.filter {
  text-align: center;
  padding: 1rem;
}
.filter-btn {
  background: #fff;
  border: 1px solid #89c997;
  color: #333;
  padding: 0.5rem 1rem;
  margin: 0.3rem;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}
.filter-btn:hover { background: #89c997; color: white; }
.filter-btn.active { background: #89c997; color: white; }

.news-container {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-width: 900px;
  margin: 2rem auto;
}

.news-card {
  display: flex;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  transition: 0.3s;
  text-decoration: none;
  color: inherit;
}
.news-card:hover { transform: translateY(-3px); }

.news-image {
  width: 150px;
  height: 150px;
  object-fit: cover;
  flex-shrink: 0;
}
.news-content {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.news-title { font-size: 1.1rem; margin: 0 0 0.3rem 0; }
.news-meta { font-size: 0.9rem; color: #666; margin-bottom: 0.5rem; }
.tag {
  display: inline-block;
  background: #e7f5ee;
  color: #4a8a63;
  padding: 0.2rem 0.6rem;
  border-radius: 10px;
  font-size: 0.8rem;
  width: fit-content;
}
</style>
</head>
<body>
<header>
  <h1>WellNews</h1>
  <p class="subtitle">健康・暮らしをもっと豊かに</p>
</header>

<section class="filter">
  <button class="filter-btn active" data-tag="all">すべて</button>
  <button class="filter-btn" data-tag="健康">健康</button>
  <button class="filter-btn" data-tag="イベント">イベント</button>
  <button class="filter-btn" data-tag="防災">防災</button>
</section>

<main id="news-container" class="news-container"></main>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const articles = [
    { title: "秋の健康フェア開催！血圧測定や栄養相談も", date: "2025-10-01", tag: "イベント", img: "https://placehold.jp/150x150.png?text=健康フェア", link:"#"},
    { title: "災害時に備える！家庭でできる防災準備チェックリスト", date: "2025-09-25", tag: "防災", img: "https://placehold.jp/150x150.png?text=防災準備", link:"#"},
    { title: "免疫力を高める食材5選", date: "2025-09-20", tag: "健康", img: "https://placehold.jp/150x150.png?text=免疫力アップ", link:"#"},
    { title: "地域の健康ウォーキング大会レポート", date: "2025-09-15", tag: "イベント", img: "https://placehold.jp/150x150.png?text=ウォーキング", link:"#"},
    { title: "非常食の選び方とローリングストックのコツ", date: "2025-09-10", tag: "防災", img: "https://placehold.jp/150x150.png?text=非常食", link:"#"},
    { title: "睡眠の質を高める夜の習慣", date: "2025-08-30", tag: "健康", img: "https://placehold.jp/150x150.png?text=睡眠習慣", link:"#"},
    { title: "健康イベント2025＠東京ビッグサイト開催決定！", date: "2025-08-20", tag: "イベント", img: "https://placehold.jp/150x150.png?text=イベント開催", link:"#"},
    { title: "熱中症対策：正しい水分補給のポイント", date: "2025-08-10", tag: "健康", img: "https://placehold.jp/150x150.png?text=水分補給", link:"#"},
    { title: "地震時の避難行動を見直そう", date: "2025-07-25", tag: "防災", img: "https://placehold.jp/150x150.png?text=地震対策", link:"#"},
    { title: "ストレスを減らす呼吸法のススメ", date: "2025-07-15", tag: "健康", img: "https://placehold.jp/150x150.png?text=呼吸法", link:"#"},
  ];

  const container = document.getElementById("news-container");
  const buttons = document.querySelectorAll(".filter-btn");

  function displayArticles(tag) {
    container.innerHTML = "";
    const filtered = tag === "all" ? articles : articles.filter(a => a.tag === tag);

    filtered.forEach(a => {
      const card = document.createElement("a");
      card.classList.add("news-card");
      card.href = a.link;
      card.innerHTML = `
        <img src="${a.img}" alt="${a.title}" class="news-image" />
        <div class="news-content">
          <div class="news-meta">${a.date}</div>
          <h2 class="news-title">${a.title}</h2>
          <span class="tag">${a.tag}</span>
        </div>
      `;
      container.appendChild(card);
    });
  }

  displayArticles("all");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      displayArticles(btn.dataset.tag);
    });
  });
});
</script>
</body>
</html>
