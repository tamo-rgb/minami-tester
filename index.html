<style>
    /* Heroスライドショー */
    .hero {
        position: relative;
        margin: 20px auto 10px auto;
        /* 上下60px、左右自動で中央寄せ */
        width: 90%;
        /* 横幅は画面の90% */
        max-width: 500px;
        /* 最大幅を500pxに制限 */
        aspect-ratio: 2/1;
        /* 高さは幅に対して2:1 */
        border-radius: 20px;
        overflow: hidden;
    }

    .hero-slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1s ease-in-out;
        z-index: 1;
    }

    .hero-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
    }

    .hero-slide.active {
        opacity: 1;
        z-index: 2;
    }

    /* --popup--*/
    #popup {
        position: fixed;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        z-index: 2000;
    }

    .popup-content {
        background: #fff;
        margin: auto 10px;
        padding: 10px 20px;
        border-radius: 15px;
        width: 95%;
        flex-direction: column;
        text-align: center;
        position: relative;
    }

    /* popup内 selectの幅を親に合わせる */
    .popup-content select {
        width: 100%;
        white-space: normal;
        /* optionの折り返しを許可 */
        word-break: break-word;
        /* 長い語句も改行 */
    }

    /* optionタグ内のテキストも折り返す */
    .popup-content select option {
        white-space: normal;
    }

    .popup-content h3 {
        font-size: var(--font-h3);
    }

    .popup-content .popup-question {
        display: flex;
        text-align: left;
        align-items: left;
        margin-bottom: 15px;
    }

    #popupSubmit {
        padding: 15px 40px;
        cursor: pointer;
        background: #247627;
        font-weight: bold;
        font-size: var(--font-button);
        color: #f5f8fb;
        border: #247627;
        border-radius: 50px;
    }

    .popup-line {
        display: flex;
        flex-wrap: wrap;
        /* 子要素を折り返す */
        flex-direction: column;
        gap: 5px;
    }

    .popup-question {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }


    /* コンテンツボックス */
    #contents {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .content-box {
        display: flex;
        padding: 10px 20px 10px 10px;
        border-radius: 20px;
        align-items: center;
        background-color: var(--color-primary);
        text-decoration: none;
    }

    .content-box .arrow {
        display: inline-block;
        margin-left: auto;
        width: 10px;
        height: 10px;
        border-bottom: 5px solid #fffdf9;
        border-right: 5px solid #fffdf9;
        transform: rotate(-45deg);
    }

    .content-box .icon img {
        width: 3em;
        padding: 0.5em;
        object-fit: contain;
    }

    .content-box .text {
        padding: 0px 0.5em;
        color: var(--color-bg);
    }

    .content-box h2,
    .content-box h4 {
        margin: 0px;
    }

    .content-box h2 {
        margin-bottom: 0.2em;
    }

    /* form */
    select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        padding: 10px 40px 10px 12px;
        font-size: var(--font-body);
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: #fff;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6H0z' fill='%23333'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 10px 6px;
        cursor: pointer;
        transition: border 0.3s, box-shadow 0.3s;
    }

    .form-section {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin: 10px;
    }

    #region,
    #audience {
        margin: 0px 30px;
    }



    /* トグルリスト */
    .personalize {
        margin: 10px;
        background-color: var(--color-secondary);
        padding: 10px;
        border-radius: 14px;
        margin-bottom: 30px;
    }

    .toggle-list {
        margin-bottom: 20px;
        border-radius: 12px;
        overflow: hidden;
        text-align: center;
        background: var(--color-primary);
    }

    .toggle-header {
        display: flex;
        padding: 15px 40px;
        cursor: pointer;
        background: var(--color-primary);
        font-weight: bold;
        color: var(--color-bg);
        font-size: var(--font-h3);
    }

    .toggle-header span {
        font-size: var(--font-h1);
        margin-left: auto;
        /* 左側のテキストから自動で離す */
    }

    .toggle-content {
        display: none;
        padding: 0.1em 0.4em;
        background: #fff;
    }

    .toggle-list.active .toggle-content {
        display: block;
    }

    .recommended-container {
        display: flex;
        justify-content: center;
        gap: 4px;
        align-items: stretch;
    }

    .recommended-card {
        background: var(--color-bg);
        justify-content: center;
        padding: 15px;
        border-radius: 15px;
        margin: 7px;
        text-align: center;
        flex: 0 0 calc(50% - 14px);
        box-sizing: border-box;
    }

    .recommended-card h4 {
        font-size: var(--font-h4);
        color: #555555;
        margin: 0px 0px 7px 0px;
    }

    .recommended-card p {
        font-size: var(--font-p);
        margin: 0px 0px 8px 0px;
        color: #333;
    }

    .recommended-card a {
        display: inline-block;
        margin-top: 8px;
        padding: 8px 16px;
        background: #0073e6;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-size: var(--font-p);
    }


    /* ボタン */
    #start-tour {
        padding: 15px 40px;
        cursor: pointer;
        background: var(--color-primary);
        font-weight: bold;
        font-size: var(--font-button);
        color: var(--color-bg);
        border: var(--color-primary);
        border-radius: 50px;
    }

    .end {
        text-align: center;
    }

    .popup-card {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1rem;
        animation: fadeIn 0.3s ease;
    }

    .popup-card.active {
        display: flex;
    }

    .popup-buttons {
        display: flex;
        gap: 1rem;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .popup_underbutton {
        display: flex;
    }
</style>

                    audienceSelect.value = savedAudience;
                    updateDynamicContent();
                }
            }
        });

        const hasVisited_index_bata = localStorage.getItem('hasVisited_index');
        if (!hasVisited_index) {
            popup.style.display = 'flex';
        }

        // カード切替関数
        function showStep(step) {
            popupCards.forEach(card => {
                card.classList.toggle('active', Number(card.dataset.step) === step);
            });
            currentStep = step;
        }

        // 「次へ」「はい」「いいえ」ボタン
        document.querySelectorAll('.popup-next, .popup-skip').forEach(btn => {
            btn.addEventListener('click', e => {
                const answer = e.target.dataset.answer;

                switch (currentStep) {
                    case 1:
                        if (answer === 'no') {
                            popup.style.display = 'none';
                            return;
                        }
                        userData.isFirst = true;
                        showStep(2);
                        break;

                    case 2:
                        userData.isResident = answer;
                        if (answer === 'yes') showStep(3);
                        else showStep(4);
                        break;

                    case 3:
                        if (!popupAudienceYes.value) {
                            alert("立場を選択してください");
                            return;
                        }
                        userData.audience = popupAudienceYes.value;
                        showStep(5);
                        break;

                    case 4:
                        if (!popupAudienceNo.value) {
                            alert("立場を選択してください");
                            return;
                        }
                        userData.audience = popupAudienceNo.value;
                        showStep(6);
                        break;

                    case 5:
                        if (!popupRegion.value) {
                            alert("地域を選択してください");
                            return;
                        }
                        userData.region = popupRegion.value;
                        showStep(6);
                        break;
                }
            });
        });

        // 🔙 戻るボタン処理
        document.querySelectorAll('.popup-back').forEach(btn => {
            btn.addEventListener('click', () => {
                switch (currentStep) {
                    case 2:
                        showStep(1);
                        break;
                    case 3:
                        showStep(2);
                        break;
                    case 4:
                        showStep(2);
                        break;
                    case 5:
                        showStep(3);
                        break;
                    case 6:
                        if (userData.isResident === 'yes') showStep(5);
                        else showStep(4);
                        break;
                }
            });
        });

        // 完了ボタン
        popupSubmit.addEventListener('click', () => {
            if (userData.isResident === 'no') userData.region = 'なし';

            localStorage.setItem('selectedRegion', userData.region);
            localStorage.setItem('selectedAudience', userData.audience);
            localStorage.setItem('hasVisited_index', 'true');

            regionSelect.value = userData.region;
            audienceSelect.value = userData.audience;

            updateDynamicContent();
            popup.style.display = 'none';
            startTour();
        });
        // -------------------------------
        // セレクト変更時：保存＋更新
        // -------------------------------
        regionSelect.addEventListener('change', () => {
            localStorage.setItem('selectedRegion', regionSelect.value);
            updateDynamicContent();
        });

        audienceSelect.addEventListener('change', () => {
            localStorage.setItem('selectedAudience', audienceSelect.value);
            updateDynamicContent();
        });

        // -------------------------------
        // ツアーボタン（2回目以降でも再開可能）
        // -------------------------------
        startTourBtn.addEventListener('click', () => {
            startTour();
        });
        // -------------------------------
        // intro.jsツアー関数
        // -------------------------------
        function startTour() {
            introJs()
                .setOptions({
                    steps: [
                        {
                            element: '#emergency',
                            intro: 'ここから緊急情報・緊急時の対応を確認できます<br>(1/4)',
                            position: 'bottom'
                        },
                        {
                            element: '#contents',
                            intro: 'ここから目的別で情報を探すことができます<br>(2/4)',
                            position: 'top'
                        },
                        {
                            element: '#tog-header',
                            intro: 'ここでは、おすすめ情報がカスタマイズできます！<br>ボタンを押して設定画面を開けます！<br>(3/4)',
                            position: 'right'
                        },
                        {
                            element: '#start-tour',
                            intro: 'このボタンを押すと、今のガイドを見れます<br>(4/4)',
                            position: 'top'
                        }
                    ],
                    showProgress: true,
                    exitOnOverlayClick: false
                })
                .oncomplete(function () {
                    alert('ガイドは終わりました！ページを見てみましょう！');
                })
                .start();
        }
        // -------------------------------
        // コンテンツ更新関数（記事＋地域）
        // -------------------------------
        function updateDynamicContent() {
            const region = regionSelect.value;
            const audience = audienceSelect.value;

            dynamicContent.innerHTML = "";

            // ごみ＋施設カード用コンテナ（横並び）
            const mainContainer = document.createElement('div');
            mainContainer.classList.add('recommended-container');
            if (region && region !== "なし") {
                const card = document.createElement('div');
                card.classList.add('recommended-card');
                card.innerHTML = `
            <h4>ごみ収集に<br>ついて</h4>
            <a href="${calendarPages[region]}" target="_blank">カレンダーを見る</a>
        `;
                mainContainer.appendChild(card);
            }

            // ごみ収集カード
            /*       if (region && region !== "なし") {
                    const card = document.createElement('div');
                    card.classList.add('recommended-card');
                    card.innerHTML = `
                        <h4>${region}のごみ収集</h4>
                        <a href="${calendarPages[region]}" target="_blank">カレンダーを見る</a>
                    `;
                    mainContainer.appendChild(card);
                  } */

            // 施設カード
            if (region && nearbyFacilities[region]) {
                nearbyFacilities[region].forEach(facility => {
                    const card = document.createElement('div');
                    card.classList.add('recommended-card');
                    card.innerHTML = `
                <h4>${facility.name}</h4>
                <a href="${facility.url}" target="_blank">詳細を見る</a>
            `;
                    mainContainer.appendChild(card);
                });
            }

            // 横並びのコンテナを追加
            dynamicContent.appendChild(mainContainer);

            // おすすめ記事カードは別コンテナ（縦並び）
            if (audience && recommendedArticles[audience]) {
                const articleContainer = document.createElement('div');
                articleContainer.classList.add('recommended-container');
                articleContainer.style.flexDirection = 'column'; // 縦並びに変更

                recommendedArticles[audience].forEach(article => {
                    const card = document.createElement('div');
                    card.classList.add('recommended-card');
                    card.innerHTML = `
                <h4>${article.title}</h4>
                <p>記事の簡単な説明をここに入れられます</p>
                <a href="${article.url}" target="_blank">詳しく見る</a>
            `;
                    articleContainer.appendChild(card);
                });

                dynamicContent.appendChild(articleContainer);
            }
        }
        // -------------------------------
        // ✅ デバッグ用：リセット関数（開発時のみ）
        // -------------------------------
        function resetTour() {
            localStorage.clear();
            alert('初回状態に戻しました。ページを再読み込みしてください。');
        }

        // -------------------------------
        // 文字サイズ切り替え（CSS変数対応）
        // -------------------------------
        const fontSizeRadios = document.querySelectorAll('input[name="font-size"]');

        // ページ読み込み時に保存値があれば反映
        const savedFontSize = localStorage.getItem('fontSize');
        if (savedFontSize) {
            document.body.classList.remove('font-small', 'font-large');
            if (savedFontSize === 'small') document.body.classList.add('font-small');
            if (savedFontSize === 'large') document.body.classList.add('font-large');

            // ラジオボタンもチェック状態に
            fontSizeRadios.forEach(radio => {
                if (radio.value === savedFontSize) radio.checked = true;
            });
        }

        // 選択変更時
        fontSizeRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                document.body.classList.remove('font-small', 'font-large');
                if (radio.value === 'small') document.body.classList.add('font-small');
                if (radio.value === 'large') document.body.classList.add('font-large');
                // 中の場合はクラスなし（デフォルト）

                // localStorageに保存
                localStorage.setItem('fontSize', radio.value);
            });
        });



        // トグルリスト
        const toggleAllBtn = document.getElementById('toggleAll');
        let allOpen = false;

        const items = document.querySelectorAll('.toggle-list');
        items.forEach(item => {
            const header = item.querySelector('.toggle-header'); // classで取得
            header.addEventListener('click', () => {
                item.classList.toggle('active');
                const span = header.querySelector('span');
                span.textContent = item.classList.contains('active') ? '-' : '+';
            });
        });


    </script>
</body>

</html>
