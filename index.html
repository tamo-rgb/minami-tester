<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>札幌市南区</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Rounded+Mplus+1c:wght@400;700&display=swap" rel="stylesheet"> -->

    <!-- Intro.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css">
    <style>
        /* ポップアウト */
        #popup {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            z-index: 2000;
        }

        .popup-content {
            background: #fff;
            margin: auto 30px;
            padding: 20px 40px;
            border-radius: 15px;
            width: 80%;
            flex-direction: column;
            text-align: center;
            position: relative;
        }

        .popup-content h3 {
            font-size: 26px;
        }

        .popup-content .popup-question {
            display: flex;
            text-align: left;
            align-items: left;
            margin-bottom: 15px;
        }

        #popupSubmit {
            padding: 15px 40px;
            cursor: pointer;
            background: #247627;
            font-weight: bold;
            font-size: 16px;
            color: #f5f8fb;
            border: #247627;
            border-radius: 50px;
        }

        .form-section {
            display: flex;
            /* ラベルとselectを横並び */
        }

        .form-row {
            display: flex;
            /* 横並び */
            gap: 20px;
            /* セクション間の間隔 */
            flex-wrap: wrap;
            /* 小さい画面では縦に折り返す */
        }

        label {
            font-weight: bold;
            color: #333;
            padding-right: 10px;
        }

        select {
            width: 80px;
            padding: 5px;
            font-size: 16px;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }


        .popup-question {
            display: flex;
            text-align: left;
            align-items: left;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #ddd;
            margin-top: 20px;
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: #0073e6;
        }

        #contents {
            margin: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .content-box .icon img {
            width: 50px;
            /* アイコンの幅 */
            height: 50px;
            /* アイコンの高さ */
            object-fit: contain;
            /* 画像の縦横比を維持 */
        }

        .content-box .text {
            flex: 1;
            color: #fffdf9;
            margin: 0 15px 0 20px;
        }

        .content-box h3 {
            font-weight: bold;
            font-size: 24px;
            margin: 0 0 7px 0;
        }

        .content-box p {
            font-size: 16px;
            margin: 0;
        }

        .personalize {
            margin: 20px;
            padding: 10px;
            background-color: #C5EFC6;
            color: #fff;
            border-radius: 15px;
            ;
        }

        #form-box {
            gap: 30px;
        }


        .recommended-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            /* カード間の隙間 */
            align-items: stretch;
            /* 高さを揃える */
        }

        .recommended-card {
            background: #f5f8fb;
            justify-content: center;
            padding: 20px;
            border-radius: 15px;
            margin: 7px;
            text-align: center;
            flex: 0 0 calc(50% - 14px);
            /* 横幅固定 50% */
            box-sizing: border-box;
        }

        .recommended-card h4 {
            font-size: 16px;
            color: #555555;
            margin: 0px 0px 7px 0px;
        }

        .recommended-card p {
            font-size: 14px;
            margin: 0px 0px 8px 0px;
            color: #333;
        }

        .recommended-card a {
            display: inline-block;
            padding: 8px 16px;
            background: #0073e6;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }

        .recommended-card a:hover {
            background: #005bb5;
        }


        .yohaku {
            padding-bottom: 100px;
        }

        /* トグルリスト */
        .toggle-list {
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            background: #fff;
        }

        .toggle-item {
            border-bottom: 1px solid #ddd;
        }

        .toggle-header {
            display: flex;
            padding: 15px 40px;
            cursor: pointer;
            background: #247627;
            font-weight: bold;
            font-size: 20px;
        }

        .toggle-header span {
            margin-left: auto;
            /* 左側のテキストから自動で離す */
        }

        .toggle-header:hover {
            background: #4e8e50;
        }

        .toggle-content {
            display: none;
            padding: 0px 30px 20px 30px;
            background: #fff;
        }

        .toggle-item.active .toggle-content {
            display: block;
        }

        #start-tour {
            padding: 15px 40px;
            cursor: pointer;
            background: #247627;
            font-weight: bold;
            font-size: 16px;
            color: #f5f8fb;
            border: #247627;
            border-radius: 50px;
        }

        .page-bottom {
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- スクロール進捗バー -->
    <div id="scrollProgress"></div>

    <!-- ポップアップ -->
    <div id="popup" style="display:none;">
        <div class="popup-content">
            <h3>札幌市南区へ<br>ようこそ</h3>

            <div class="popup-question">
                <label>お住まいの地域</label>
                <select id="popupRegion">
                    <option value="なし">なし</option>

                </select>
            </div>

            <div class="popup-question">
                <label>対象者</label>

                    <option value="一般">一般</option>

            <button id="popupSubmit">完了</button>

    </div>



    <!-- ヘッダー -->

    <!-- スライドメニュー -->
    <nav id="sideMenu">
        <ul>
            <li><a href="#">ホーム</a></li>
            <li><a href="#">情報を探す</a></li>
            <li><a href="#">お知らせ・ニュース</a></li>
            <li><a href="#">通知をすぐ受け取る</a></li>
            <li><a href="#">お問い合わせ</a></li>
        </ul>
    </nav>

    <!-- メインコンテンツ -->
    <main>
        <!-- Heroスライドショー -->
        <section class="hero">
            <a href="page1.html" class="hero-slide">

            <a href="page2.html" class="hero-slide">

            </a>
            <a href="page3.html" class="hero-slide">
                <img src="photo_3.JPG" alt="画像3">
            </a>
        </section>

        <!-- コンテンツボックス -->
        <section id="contents" data-step="1">
            <a href="search.html" class="content-box">
                <div class="icon">
                    <img src="data/home_1.png" alt="情報を探すアイコン">

            </a>

            <!--             <a href="page3.html" class="content-box">
                <div class="icon">
                    <img src="icon_3.png" alt="カスタマイズ">
                </div>
                <div class="text">
                    <h3>カスタマイズする</h3>
                    <p>好きな情報にたどり着く</p>
                </div>
                <div class="arrow"></div>
            </a> -->
        </section>
        <section class="personalize">
            <!-- トグルリスト -->
            <div class="toggle-list">
                <div class="toggle-item">
                    <div id="nav-toggle">
                        <div class="toggle-header">カスタマイズをする<span>+</span></div>
                    </div>
                    <div class="toggle-content">ここに項目1の詳細内容が入ります。


                        <div id="form-box" data-step="3" data-intro="ここでは、地域と対象者を選択することで以下のおすすめ情報が見られます">
                            <div class="form-section">
                                <label for="region">お住まいの地域</label>
                                <select id="region">
                                    <option value="">未設定</option>
                                    <option value="澄川">澄川</option>
                                    <option value="真駒内">真駒内</option>
                                    <option value="滝野">滝野</option>
                                </select>
                            </div>

                            <div class="form-section">
                                <label for="audience">対象者</label>
                                <select id="audience">
                                    <option value="一般">一般</option>

    <!-- 下部固定メニュー -->

        <a href="index.html" class="bottom-btn">トップページへ</a>

    <!-- script -->
    <script src="script.js"></script>
    <!-- Intro.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/intro.js/minified/intro.min.js"></script>


    <script>
        // ============================================================
        // 🎯 全体の目的：
        // 初回訪問 → POPUP回答後にツアー開始
        // 2回目以降 → POPUPなしで前回の選択を自動反映（ボタンでツアー再開可）
        // ============================================================

        // -------------------------------
        // 要素取得
        // -------------------------------
        const regionSelect = document.getElementById('region');
        const audienceSelect = document.getElementById('audience');
        const dynamicContent = document.getElementById('dynamicContent');

        const popup = document.getElementById('popup');
        const popupRegion = document.getElementById('popupRegion');
        const popupAudience = document.getElementById('popupAudience');
        const popupSubmit = document.getElementById('popupSubmit');

        const startTourBtn = document.getElementById('start-tour');

        // -------------------------------
        // 記事データ
        // -------------------------------
        const recommendedArticles = {
            一般: [
                { title: "簡単に証明書発行をするコツ", url: "#" },
                { title: "国民健康保険料の夜間納付相談のお知らせ", url: "https://www.city.sapporo.jp/minami/hoken/yakannofusodan.html" },
                { title: "南区役所食堂営業再開のお知らせ", url: "https://www.city.sapporo.jp/minami/oshirase/20251020shokudo.html" }
            ],
            一人暮らし: [
                { title: "", url: "" },
                { title: "勉強効率アップのコツ", url: "#" },
                { title: "アルバイト情報まとめ", url: "#" }
            ],
            事業者: [
                { title: "仕事効率化ツール", url: "#" },
                { title: "おすすめ資格情報", url: "#" },
                { title: "ストレス対策方法", url: "#" }
            ],
            シニア: [
                { title: "紅葉ウオーキング大会", url: "https://www.city.sapporo.jp/minami/news/202510/20251018.html" },
                { title: "熟年者ふれあい交流会", url: "https://www.city.sapporo.jp/minami/news/202510/20251015-2.html" },
                { title: "南区の認知症への取組", url: "https://www.city.sapporo.jp/minami/fukushi/nintisyoumap.html" }
            ]
        };
        const calendarPages = {
            澄川: "calendar_sumikawa.html",
            真駒内: "calendar_makomau.html",
            滝野: "calendar_takino.html"
        };
        const nearbyFacilities = {
            澄川: [
                { name: "近くの施設", url: "facility_sumikawa_library.html" },
            ],
            真駒内: [
                { name: "真駒内の近くの施設", url: "facility_makomanai_gym.html" },
            ],
            滝野: [
                { name: "滝野の近くの施設", url: "facility_takino_center.html" }
            ]
        };


        // -------------------------------
        // 前回訪問データを取得
        // -------------------------------
        const hasVisited = localStorage.getItem('hasVisited');
        const savedRegion = localStorage.getItem('selectedRegion');
        const savedAudience = localStorage.getItem('selectedAudience');

        // -------------------------------
        // 初期化処理（ページ読み込み時）
        // -------------------------------
        window.addEventListener('load', () => {
            if (!hasVisited) {
                // 初回訪問 → POPUPを表示
                popup.style.display = 'flex';
            } else {
                // 2回目以降 → 前回選択を反映
                if (savedRegion && savedAudience) {
                    regionSelect.value = savedRegion;
                    audienceSelect.value = savedAudience;
                    updateDynamicContent();
                }
            }
        });

        // -------------------------------
        // POPUP送信時（初回訪問時のみ）
        // -------------------------------
        popupSubmit.addEventListener('click', () => {
            const selectedRegion = popupRegion.value;
            const selectedAudience = popupAudience.value;

            if (!selectedRegion || !selectedAudience) {
                alert("両方選択してください");
                return;
            }

            // 選択内容をフォームに反映
            regionSelect.value = selectedRegion;
            audienceSelect.value = selectedAudience;

            // コンテンツ更新
            updateDynamicContent();

            // 保存
            localStorage.setItem('selectedRegion', selectedRegion);
            localStorage.setItem('selectedAudience', selectedAudience);
            localStorage.setItem('hasVisited', 'true'); // 初回訪問済みフラグ

            // POPUPを閉じる
            popup.style.display = 'none';

            // 🎯 初回のみツアー開始
            startTour();
        });

        // -------------------------------
        // セレクト変更時：保存＋更新
        // -------------------------------
        regionSelect.addEventListener('change', () => {
            localStorage.setItem('selectedRegion', regionSelect.value);
            updateDynamicContent();
        });

        audienceSelect.addEventListener('change', () => {
            localStorage.setItem('selectedAudience', audienceSelect.value);
            updateDynamicContent();
        });

        // -------------------------------
        // ツアーボタン（2回目以降でも再開可能）
        // -------------------------------
        startTourBtn.addEventListener('click', () => {
            startTour();
        });

        // -------------------------------
        // intro.jsツアー関数
        // -------------------------------
        function startTour() {
            introJs()
                .setOptions({
                    steps: [
                        {
                            element: '#emergency',
                            intro: 'ここから緊急情報・緊急時の対応を確認できます',
                            position: 'bottom'
                        },
                        {
                            element: '#contents',
                            intro: 'ここから目的別で情報を探すことができます',
                            position: 'top'
                        },
                        {
                            element: '#nav-toggle',
                            intro: 'ここでは、おすすめ情報がカスタマイズできます！<br>ボタンを押して設定画面を開けます！',
                            position: 'right'
                        },
                        {
                            element: '#start-tour',
                            intro: 'このボタンを押すと、今のガイドを見れます',
                            position: 'top'
                        }
                    ],
                    showProgress: true,
                    exitOnOverlayClick: false
                })
                .oncomplete(function () {
                    alert('ツアーが終了しました！');
                })
                .start();
        }

        // -------------------------------
        // コンテンツ更新関数（記事＋地域）
        // -------------------------------
        function updateDynamicContent() {
            const region = regionSelect.value;
            const audience = audienceSelect.value;

            dynamicContent.innerHTML = "";

            // ごみ＋施設カード用コンテナ（横並び）
            const mainContainer = document.createElement('div');
            mainContainer.classList.add('recommended-container');

            // ごみ収集カード
            if (region) {
                const card = document.createElement('div');
                card.classList.add('recommended-card');
                card.innerHTML = `
            <h4>${region}のごみ収集</h4>
            <a href="${calendarPages[region]}" target="_blank">カレンダーを見る</a>
        `;
                mainContainer.appendChild(card);
            }

            // 施設カード
            if (region && nearbyFacilities[region]) {
                nearbyFacilities[region].forEach(facility => {
                    const card = document.createElement('div');
                    card.classList.add('recommended-card');
                    card.innerHTML = `
                <h4>${facility.name}</h4>
                <a href="${facility.url}" target="_blank">詳細を見る</a>
            `;
                    mainContainer.appendChild(card);
                });
            }

            // 横並びのコンテナを追加
            dynamicContent.appendChild(mainContainer);

            // おすすめ記事カードは別コンテナ（縦並び）
            if (audience && recommendedArticles[audience]) {
                const articleContainer = document.createElement('div');
                articleContainer.classList.add('recommended-container');
                articleContainer.style.flexDirection = 'column'; // 縦並びに変更

                recommendedArticles[audience].forEach(article => {
                    const card = document.createElement('div');
                    card.classList.add('recommended-card');
                    card.innerHTML = `
                <h4>${article.title}</h4>
                <p>記事の簡単な説明をここに入れられます</p>
                <a href="${article.url}" target="_blank">詳しく見る</a>
            `;
                    articleContainer.appendChild(card);
                });

                dynamicContent.appendChild(articleContainer);
            }
        }


        // -------------------------------
        // ✅ デバッグ用：リセット関数（開発時のみ）
        // -------------------------------
        function resetTour() {
            localStorage.clear();
            alert('初回状態に戻しました。ページを再読み込みしてください。');
        }

        // トグルリスト
        const items = document.querySelectorAll('.toggle-item');
        const toggleAllBtn = document.getElementById('toggleAll');
        let allOpen = false;

        // 各トグルクリックで開閉
        items.forEach(item => {
            const header = item.querySelector('.toggle-header');
            header.addEventListener('click', () => {
                item.classList.toggle('active');
                const span = header.querySelector('span');
                span.textContent = item.classList.contains('active') ? '-' : '+';
            });
        });

    </script>




</body>
